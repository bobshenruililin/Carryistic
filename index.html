<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#05070a" />
  <meta name="description" content="Carry’s painting, photography and sculpture. Fifteen works, one ray of light each, from Dusk til Dawn to Proud Daddy." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23040406'/%3E%3Cpath d='M5 6h6v6H5zm8 8h9v9h-9zm11 11h12v12H24z' fill='%23f4f1e9'/%3E%3C/svg%3E" />
  <link rel="preload" as="image" href="./landing/photo.webp" fetchpriority="high" />
  <title>Carryistic</title>
</head>
<body>
  <a class="skip" href="#works">Skip to the list of works</a>

  <div class="stage" id="stage" aria-hidden="true"></div>

  <div class="reel-ui" id="reel-ui" hidden>
    <div class="bars" id="bars" aria-hidden="true"></div>
    <p class="title" id="title" aria-live="polite"><span class="title-n"></span><span class="title-t"></span></p>
    <button type="button" class="ticks" id="ticks" aria-label="All works"></button>
    <div class="held" id="held" hidden>
      <p class="held-n"></p>
      <p class="held-t"></p>
      <p class="held-links"></p>
    </div>
  </div>

  <section class="landing" id="landing" aria-label="Her light">
    <canvas id="light" aria-hidden="true"></canvas>
    <div class="landing-foot">
      <div class="landing-words">
        <h1 class="hello">Hi, I’m Carry.</h1>
        <button type="button" class="lit" id="lit" hidden><i class="lit-chip"></i><span class="lit-t"></span><span class="lit-go" aria-hidden="true">↗</span></button>
      </div>
      <div class="landing-buttons">
        <button type="button" class="pill" data-open="works">≡ All works</button>
        <button type="button" class="pill solid" id="play">▶ Play the film</button>
      </div>
    </div>
  </section>

  <header class="chrome">
    <button type="button" class="mark" id="mark" aria-label="Carryistic: back to her light"><span class="mark-squares" aria-hidden="true"><i></i><i></i><i></i></span>carryistic</button>
    <button type="button" class="sound" id="sound" aria-pressed="true" aria-label="Sound on"><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="sound-label">Sound</span></button>
  </header>

  <div class="works" id="works" role="dialog" aria-modal="true" aria-label="All works" hidden>
    <button type="button" class="works-close" aria-label="Close">×</button>
    <ol class="works-list" id="works-list"></ol>
    <p class="works-foot">
      <a href="https://www.instagram.com/carryistic/" target="_blank" rel="noreferrer">@carryistic ↗</a>
      <button type="button" data-open="credits">Credits</button>
    </p>
  </div>

  <dialog id="plates" class="sheet" aria-label="Every slide">
    <button type="button" class="sheet-close" aria-label="Close">×</button>
    <div id="collection"></div>
  </dialog>
  <dialog id="info" class="sheet sheet-narrow" aria-labelledby="info-title">
    <button type="button" class="sheet-close" aria-label="Close">×</button>
    <div id="info-body"></div>
  </dialog>
  <noscript><p class="noscript">This portfolio needs JavaScript. Carry’s work is on <a href="https://www.instagram.com/carryistic/">Instagram</a> and in the <a href="https://github.com/bobshenruililin/Carryistic/tree/main/archive/artworks">original files</a>.</p></noscript>
  <script type="module" src="/src/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#040406" />
  <meta name="description" content="Carry’s painting, photography and sculpture as one continuous scroll. Fifteen works, from Dusk til Dawn to Proud Daddy, every slide one click from its original." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='8' fill='%23040406'/%3E%3Cpath d='M5 6h6v6H5zm8 8h9v9h-9zm11 11h12v12H24z' fill='%23f4f1e9'/%3E%3C/svg%3E" />
  <link rel="preload" as="image" href="./scroll/h/P01-02.webp" fetchpriority="high" />
  <title>Carryistic</title>
</head>
<body>
  <a class="skip" href="#coda">Skip to the end of the scroll</a>
  <header class="chrome">
    <a class="mark" href="#top" aria-label="Carryistic, back to the beginning"><span class="mark-squares" aria-hidden="true"><i></i><i></i><i></i></span>carryistic</a>
    <button type="button" class="sound" id="sound" aria-pressed="false" aria-label="Play the score" hidden><span class="sound-bars" aria-hidden="true"><i></i><i></i><i></i></span><span class="sound-label">Sound</span></button>
    <nav class="rail" id="rail" aria-label="The fifteen works"></nav>
  </header>

  <div class="stage" id="stage" aria-hidden="true">
    <p class="label"><span class="label-n"></span><span class="label-t"></span></p>
    <span class="cue"></span>
  </div>

  <main id="top">
    <h1 class="sr-only">Carry’s painting, photography and sculpture</h1>
    <div id="track"></div>
    <section class="coda" id="coda" aria-labelledby="coda-title">
      <div class="coda-inner">
        <h2 id="coda-title" class="coda-name">carryistic</h2>
        <p class="coda-line">Painting, photography, sculpture.</p>
        <a class="coda-instagram" href="https://www.instagram.com/carryistic/" target="_blank" rel="noreferrer">@carryistic <span aria-hidden="true">↗</span></a>
        <p class="coda-quiet">
          <button type="button" data-open="plates">All 153 works</button>
          <button type="button" data-open="film">Afterimage, the film</button>
          <button type="button" data-open="credits">Credits</button>
          <button type="button" data-open="note">Leave a note</button>
        </p>
      </div>
    </section>
  </main>

  <dialog id="plates" class="sheet" aria-label="All works">
    <button type="button" class="sheet-close" aria-label="Close">×</button>
    <div id="collection"></div>
  </dialog>
  <dialog id="info" class="sheet sheet-narrow" aria-labelledby="info-title">
    <button type="button" class="sheet-close" aria-label="Close">×</button>
    <div id="info-body"></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">This scroll needs JavaScript. Carry’s work is on <a href="https://www.instagram.com/carryistic/">Instagram</a> and in the <a href="https://github.com/bobshenruililin/Carryistic/tree/main/archive/artworks">original files</a>.</p></noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
